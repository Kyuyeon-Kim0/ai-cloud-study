{% extends "base.html" %}

{% block title %}상품 등록{% endblock %}
{% block body_class %}product-page{% endblock %}
{% block main_class %}product-container{% endblock %}
{% block content %}
<div class="product-header">
    <h1>상품 등록</h1>
    <p>등록할 상품 정보를 입력하세요.</p>
</div>

<form class="product-form" method="post" action="{{ url_for('product_create') }}">
    <div class="form-group">
        <label for="product-name">상품명</label>
        <input id="product-name" name="name" type="text" maxlength="255"
               placeholder="상품명을 입력하세요" required>
    </div>
    <div class="form-group">
        <label for="product-price">단가</label>
        <input id="product-price" name="price" type="number" min="0" max="2147483647" step="1"
               placeholder="단가를 입력하세요" required>
    </div>
    <div class="form-group">
        <label for="product-description">상세설명</label>
        <textarea id="product-description" name="description" rows="6" maxlength="65535"
                  placeholder="상품 상세설명을 입력하세요" required></textarea>
    </div>
    <div class="form-group">
        <label for="manager-code">담당자코드</label>
        <input id="manager-code" name="manager_code" type="text" maxlength="20"
               placeholder="담당자코드를 입력하세요" required>
    </div>
    <div class="form-actions"><button type="submit">상품 등록</button></div>
</form>
<p><a href="{{ url_for('product_list') }}">상품 목록으로 돌아가기</a></p>
{% endblock %}
