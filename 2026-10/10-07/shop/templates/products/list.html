{% extends "base.html" %}

{% block title %}상품 목록{% endblock %}
{% block content %}
<div id="title-area">
    <h1>상품 목록</h1>
    <p>총 {{ products|length }}개 상품</p>
    <p><a href="{{ url_for('product_form') }}">상품 등록</a></p>
</div>

<form method="get" action="{{ url_for('product_list') }}">
    <input id="search-input" type="search" name="q" value="{{ keyword }}"
           placeholder="상품명 검색" aria-label="상품명 검색" maxlength="200">
    <button type="submit">검색</button>
</form>

<div class="table-area">
    <table>
        <thead>
            <tr><th scope="col">상품명</th><th scope="col">가격</th></tr>
        </thead>
        <tbody id="product-list">
            {% for product in products %}
            <tr class="product-row">
                <td><a href="{{ url_for('product_detail', product_id=product.id) }}">{{ product.name }}</a></td>
                <td>{{ "{:,}".format(product.price) }}원</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% if not products %}
    <p id="empty-message" role="status">검색 결과가 없습니다.</p>
    {% endif %}
</div>
{% endblock %}
